image: python:3.12

variables:
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

stages:
  - deploy

pages:
  stage: deploy
  before_script:
    - pip install poetry
    - poetry install
  script:
    - poetry run mkdocs build -d public
  artifacts:
    expire_in: 30 days
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
